name: Java Maven CI

# WHEN should this workflow run?
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest      # the VM GitHub gives you, fresh every run

    steps:
      # Step 1: pull your repo's code onto the runner VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"        # speeds up future runs by caching ~/.m2

      # Step 3: run the actual build + unit tests
      - name: Run tests with Maven
        run: mvn -B test

      # Step 4: save the test report so you can download/inspect it later
      - name: Upload test report
        if: always()            # upload even if tests failed
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-report
          path: target/surefire-reports/
          retention-days: 10
